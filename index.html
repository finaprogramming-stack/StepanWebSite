<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Выездной автоэлектрик в Москве и Московской области. Опыт 19 лет. Быстрая диагностика и ремонт на месте.">
    <meta name="keywords" content="автоэлектрик, выездной автоэлектрик, ремонт авто, Москва, Московская область, Степан">
    <title>Импульс-Авто | Выездной автоэлектрик</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="background-overlay"></div>

    <div class="container">
        <header class="glass-panel text-center hero">
            <h1 class="logo-text">Импульс-<span class="highlight">Авто</span></h1>
            <h2>Профессиональный выездной автоэлектрик</h2>
            <p class="subtitle">Степан — опыт работы <strong>19 лет</strong></p>
            <p class="location"><i class="fas fa-map-marker-alt"></i> Выезд: Москва и Московская область</p>

            <div class="action-buttons">
                <a href="tel:+79299789137" class="btn btn-primary"><i class="fas fa-phone-alt"></i> Позвонить</a>
                <a href="https://wa.me/79299789137" class="btn btn-wa" target="_blank"><i class="fab fa-whatsapp"></i> WhatsApp</a>
                <a href="https://t.me/+79299789137" class="btn btn-tg" target="_blank"><i class="fab fa-telegram-plane"></i> Telegram</a>
            </div>

            <button id="callbackBtn" class="btn btn-outline">Заказать обратный звонок</button>
        </header>

        <section class="glass-panel mt-2">
            <h3>Примеры работ</h3>
            <div class="gallery-grid">
                <div class="gallery-item">Фото 1</div>
                <div class="gallery-item">Фото 2</div>
                <div class="gallery-item">Фото 3</div>
                <div class="gallery-item">Фото 4</div>
            </div>
        </section>

        <section class="glass-panel mt-2">
            <h3>Отзывы клиентов</h3>
            <div id="reviewsList" class="reviews-container">
                </div>

            <form id="reviewForm" class="mt-2 form-glass">
                <h4>Оставить отзыв</h4>
                <input type="text" id="reviewerName" placeholder="Ваше имя" required>
                <textarea id="reviewText" placeholder="Напишите ваш отзыв..." rows="3" required></textarea>
                <button type="submit" class="btn btn-primary">Отправить</button>
            </form>
        </section>
    </div>

    <div id="callbackModal" class="modal">
        <div class="modal-content glass-panel">
            <span class="close-btn">&times;</span>
            <h3>Обратный звонок</h3>
            <form id="callbackForm">
                <input type="text" placeholder="Ваше имя" required>
                <input type="tel" placeholder="Ваш телефон" required>
                <button type="submit" class="btn btn-primary mt-1">Жду звонка</button>
            </form>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
